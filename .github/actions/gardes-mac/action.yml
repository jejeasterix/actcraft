name: Gardes du Mac mini
description: >-
  Gardes du runner auto-hébergé du Mac mini, comme l'étape du job build de ci.yml : dépôt privé seulement, et
  attente d'une mémoire disponible suffisante (le Mac porte aussi les sessions Claude). La garde qui fait foi est
  côté Mac, hors de portée d'une PR : ~/actions-runner-actcraft/garde-job.sh (ACTIONS_RUNNER_HOOK_JOB_STARTED).
inputs:
  memoire-go:
    description: "Mémoire disponible exigée, en Go entiers (0 : pas d'attente)"
    default: "3"
runs:
  using: composite
  steps:
    - name: Visibilité du dépôt et mémoire disponible
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MEMOIRE_GO: ${{ inputs.memoire-go }}
      run: |
        visibilite=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
        if [ "$visibilite" != "private" ]; then
          echo "::error::Dépôt $visibilite : runner auto-hébergé interdit. Arrêter et désenregistrer le runner du Mac (~/actions-runner-actcraft)."
          exit 1
        fi
        if [ "$MEMOIRE_GO" -le 0 ]; then exit 0; fi
        dispo_go() {
          # Part libre selon macOS (mémoire compressible comprise), en Go entiers.
          memory_pressure | awk -v t="$(sysctl -n hw.memsize)" '/free percentage/ {sub("%","",$NF); printf "%d", $NF*t/100/1073741824}'
        }
        for i in $(seq 1 30); do
          go=$(dispo_go)
          if ! [ "$go" -ge 0 ] 2>/dev/null; then echo "::error::Mémoire disponible illisible (memory_pressure)"; exit 1; fi
          if [ "$go" -ge "$MEMOIRE_GO" ]; then echo "Mémoire disponible : $go Go"; exit 0; fi
          echo "Mémoire disponible : $go Go (< $MEMOIRE_GO Go), nouvel essai dans 30 s ($i/30)"
          sleep 30
        done
        echo "::error::Moins de $MEMOIRE_GO Go de mémoire disponible sur le Mac depuis 15 min : job abandonné, à relancer."
        exit 1
