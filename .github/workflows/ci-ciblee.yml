name: CI ciblée

# Rejoue seulement les tests nommés, sur le même exécuteur que le job build de ci.yml (windows-latest ou macos-latest),
# avec le même Qt, le même preset et le même environnement. Sert à savoir si un test rouge est réparé sans attendre la
# suite complète (119 min de tests sous Windows, run 42932734568).
# Lancement (doc : docs/ci-ciblee.md) :
#   gh workflow run ci-ciblee.yml --repo jejeasterix/actcraft --ref main -f tests='^tst_bench_' [-f plateforme=macos] [-f ref=<branche|SHA>]
# Contrat avec l'outillage (ci-ciblee.cjs) : nom de fichier ci-ciblee.yml ; entrées tests, plateforme, ref ; artefact
# journaux-tests (scripts/ci/journaux-tests.cmake) toujours téléversé en cas d'échec.
# Le fichier de workflow vient de --ref (main suffit) ; le code testé vient de l'entrée ref.
# Exécuteurs : les machines de GitHub, gratuites pour un dépôt public (OA72, 2026-11-12) ; les runners auto-hébergés
# du PC et du Mac mini sont retirés. Aucun cache de compilation : la compilation part d'un arbre vide, comme dans ci.yml.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Motif ctest -R (obligatoire), ex. ^tst_bench_verdict$"
        type: string
        required: true
      plateforme:
        description: "Plateforme de la CI à utiliser"
        type: choice
        options: [windows, macos]
        default: windows
      ref:
        description: "Branche ou SHA à tester (vide : la ref du lancement)"
        type: string
        default: ""

concurrency:
  group: ci-ciblee-${{ inputs.plateforme }}-${{ inputs.ref || github.ref }}-${{ inputs.tests }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: "6.12.0"

jobs:
  tests:
    name: tests ciblés (${{ inputs.plateforme }})
    runs-on: ${{ inputs.plateforme == 'macos' && 'macos-latest' || 'windows-latest' }}
    # Compilation mesurée sur les machines de GitHub (run 43303503126) : 17 min (macOS), 26 min (Windows) ; plus les
    # tests (25 min au plus, délai de l'étape) et l'installation : 90 min.
    timeout-minutes: 90
    steps:
      # Dossier des journaux créé avant tout : un échec de checkout, de configuration ou de compilation
      # téléverse quand même l'artefact journaux-tests (contrat avec ci-ciblee.cjs), avec au moins ce contexte.
      - name: Contexte des journaux (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MOTIF: ${{ inputs.tests }}
          REF: ${{ inputs.ref || github.ref }}
          JOURNAUX: ${{ runner.temp }}/journaux-tests
        run: |
          New-Item -ItemType Directory -Force $env:JOURNAUX | Out-Null
          "tests=$env:MOTIF`nref=$env:REF`nrunner=$env:RUNNER_NAME`nrun=$env:GITHUB_RUN_ID" | Set-Content "$env:JOURNAUX/contexte.txt"

      - name: Contexte des journaux (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MOTIF: ${{ inputs.tests }}
          REF: ${{ inputs.ref || github.ref }}
          JOURNAUX: ${{ runner.temp }}/journaux-tests
        run: |
          mkdir -p "$JOURNAUX"
          printf 'tests=%s\nref=%s\nrunner=%s\nrun=%s\n' "$MOTIF" "$REF" "$RUNNER_NAME" "$GITHUB_RUN_ID" > "$JOURNAUX/contexte.txt"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      # Script de collecte pris dans le commit du workflow, pas dans la ref testée : une ref antérieure à ce workflow
      # (bissection, branche non rebasée) garde ses journaux.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: _ci-ciblee-outils
          sparse-checkout: scripts/ci

      # Étapes suivantes reprises du job build de ci.yml, à garder alignées avec lui.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Même aqtinstall et mêmes modules que le job build de ci.yml.
      - name: Installer Ninja et aqtinstall
        run: python -m pip install ninja "git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Installer Qt
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then host=windows; arch=win64_msvc2022_64; else host=mac; arch=clang_64; fi
          python -m aqt install-qt "$host" desktop "$QT_VERSION" "$arch" -m qtshadertools qtimageformats qtpdf qtmultimedia qtwebview qtwebengine qtwebchannel qtpositioning --outputdir "$RUNNER_TEMP/Qt"
          dir=$(ls -d "$RUNNER_TEMP"/Qt/"$QT_VERSION"/*/ | head -1)
          echo "ACTCRAFT_QT_DIR=${dir%/}" >> "$GITHUB_ENV"
          echo "${dir%/}/bin" >> "$GITHUB_PATH"

      # Sortie audio virtuelle (BlackHole) : la machine de GitHub liste une sortie qui ne consomme rien, et le lecteur
      # ne voit jamais sa position avancer (tst_media_player, run 43303503126), comme dans ci.yml. BlackHole consomme le son en temps réel,
      # comme une vraie carte ; elle devient la sortie par défaut.
      - name: Sortie audio virtuelle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          for i in $(seq 1 20); do SwitchAudioSource -a -t output | grep -qx 'BlackHole 2ch' && break; sleep 1; done
          SwitchAudioSource -t output -s 'BlackHole 2ch'
          echo "Sortie audio : $(SwitchAudioSource -c -t output)"

      # 4 tests à la fois sous Windows, comme le job build de ci.yml.
      - name: Tests en parallèle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CTEST_PARALLEL_LEVEL=4" >> $env:GITHUB_ENV'

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      # Fin des étapes reprises de ci.yml.

      - name: Configurer
        run: cmake --preset debug

      - name: Compiler
        timeout-minutes: 120
        run: cmake --build --preset debug

      # Le motif passe par l'environnement, jamais dans le script : il ne peut rien injecter. Une étape par shell.
      - id: tester_windows
        name: Tester (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: pwsh
        env:
          MOTIF: ${{ inputs.tests }}
          JOURNAUX: ${{ runner.temp }}/journaux-tests
        run: |
          if (-not $env:MOTIF) { '::error::Entrée tests vide : elle lancerait toute la suite.'; exit 1 }
          cmake -E rm -f build/debug/Testing/Temporary/LastTestsFailed.log
          cmake -E rm -rf build/debug/journaux-tests
          ctest --preset debug --output-on-failure -R $env:MOTIF --output-log "$env:JOURNAUX/ctest-sortie.txt" --output-junit "$env:JOURNAUX/ctest-junit.xml"

      - id: tester_macos
        name: Tester (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 25
        shell: bash
        env:
          MOTIF: ${{ inputs.tests }}
          JOURNAUX: ${{ runner.temp }}/journaux-tests
        run: |
          if [ -z "$MOTIF" ]; then echo '::error::Entrée tests vide : elle lancerait toute la suite.'; exit 1; fi
          cmake -E rm -f build/debug/Testing/Temporary/LastTestsFailed.log
          ctest --preset debug --output-on-failure -R "$MOTIF" --output-log "$JOURNAUX/ctest-sortie.txt" --output-junit "$JOURNAUX/ctest-junit.xml"

      - name: Journaux des tests rouges
        if: failure() && (steps.tester_windows.outcome == 'failure' || steps.tester_macos.outcome == 'failure')
        run: cmake -DBUILD_DIR=build/debug "-DOUT_DIR=${{ runner.temp }}/journaux-tests" -P _ci-ciblee-outils/scripts/ci/journaux-tests.cmake

      - name: Téléverser les journaux
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journaux-tests
          path: ${{ runner.temp }}/journaux-tests
          if-no-files-found: warn
          retention-days: 14
