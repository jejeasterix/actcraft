name: CI

on:
  push:
    branches:
      - main
      - "essai-ci/**"
      - "!essai-ci/release-**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le format C++
        run: |
          pip install clang-format==23.1.3
          git ls-files '*.cpp' '*.h' '*.hpp' | xargs --no-run-if-empty clang-format --dry-run --Werror

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt_arch: win64_msvc2022_64
          - os: macos-latest
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # aqtinstall 3.3.0 ne sait pas installer Qt 6.12 (nouveau découpage du dépôt Qt) :
      # on prend la version de développement, vérifiée le 2026-10-13.
      - name: Installer Ninja et aqtinstall
        run: python -m pip install ninja "git+https://github.com/miurahr/aqtinstall"

      - name: Installer Qt
        shell: bash
        run: |
          host=$([ "${{ runner.os }}" = "Windows" ] && echo windows || echo mac)
          python -m aqt install-qt "$host" desktop "$QT_VERSION" ${{ matrix.qt_arch }} -m qtshadertools qtimageformats --outputdir "$RUNNER_TEMP/Qt"
          dir=$(ls -d "$RUNNER_TEMP"/Qt/"$QT_VERSION"/*/ | head -1)
          echo "ACTCRAFT_QT_DIR=${dir%/}" >> "$GITHUB_ENV"
          echo "${dir%/}/bin" >> "$GITHUB_PATH"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configurer
        run: cmake --preset debug

      - name: Compiler
        run: cmake --build --preset debug

      - name: Tester
        run: ctest --preset debug

      # N1-8 : premier contact avec Metal ; informatif, ne bloque jamais la CI.
      - name: Banc sur la plateforme native (informatif)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          if [ ! -x ./build/debug/actcraft-bench ]; then
            echo "actcraft-bench introuvable dans build/debug :"; ls build/debug; exit 1
          fi
          ./build/debug/actcraft-bench --scenario court --rendu auto --taille 1280x800 --sortie "$RUNNER_TEMP/bench-macos.json"
          echo "code de sortie du banc : $?"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('graphics_api =', d['graphics_api'])" "$RUNNER_TEMP/bench-macos.json"

  # S1 : installateur construit et essayé, jamais téléversé (DA9).
  paquet-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Ninja et aqtinstall
        run: python -m pip install ninja "git+https://github.com/miurahr/aqtinstall"

      - name: Installer Qt
        shell: bash
        run: |
          python -m aqt install-qt windows desktop "$QT_VERSION" win64_msvc2022_64 -m qtshadertools qtimageformats --outputdir "$RUNNER_TEMP/Qt"
          dir=$(ls -d "$RUNNER_TEMP"/Qt/"$QT_VERSION"/*/ | head -1)
          echo "ACTCRAFT_QT_DIR=${dir%/}" >> "$GITHUB_ENV"
          echo "${dir%/}/bin" >> "$GITHUB_PATH"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Installer Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe introuvable après installation" }
          "ACTCRAFT_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Construire l'installateur
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/paquet.ps1

      - name: Essai de l'installateur (S1)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/essai-installateur.ps1 -Rendu logiciel

  # S3 : APK arm64-v8a et x86_64 construits, x86_64 essayé sur l'émulateur (KVM), jamais téléversés (DA9).
  # RECHERCHE (L1-T19, temporaire) : modes de GPU de l'émulateur sans GPU hôte ; captures en artefact court.
  android:
    runs-on: ubuntu-latest
    env:
      # Un démon Gradle resté vivant verrouille le dossier de construction (piège L1-T17).
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - name: Place disque
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt 6.12 pour Android exige JDK 21 (VERIF jdk17, docs/verifications/2026-10-14-outillage-paquets.md).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Versions de la chaîne Android
        run: |
          cat packaging/android/versions.env >> "$GITHUB_ENV"
          echo "ACTCRAFT_VERSION=$(pwsh -NoProfile -Command '. ./scripts/version-projet.ps1; Get-ActCraftVersion')" >> "$GITHUB_ENV"

      - name: Installer Ninja, aqtinstall et Pillow
        run: python -m pip install ninja pillow "git+https://github.com/miurahr/aqtinstall"

      - name: Installer Qt (hôte et Android)
        run: |
          python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -m qtshadertools qtimageformats --outputdir "$RUNNER_TEMP/Qt"
          python -m aqt install-qt all_os android "$QT_VERSION" android_arm64_v8a -m qtshadertools qtimageformats --outputdir "$RUNNER_TEMP/Qt"
          python -m aqt install-qt all_os android "$QT_VERSION" android_x86_64 -m qtshadertools qtimageformats --outputdir "$RUNNER_TEMP/Qt"
          ls "$RUNNER_TEMP/Qt/$QT_VERSION"
          echo "ACTCRAFT_QT_HOST_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
          echo "ACTCRAFT_QT_ANDROID_ARM64_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/android_arm64_v8a" >> "$GITHUB_ENV"
          echo "ACTCRAFT_QT_ANDROID_X86_64_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/android_x86_64" >> "$GITHUB_ENV"

      - name: Installer le NDK, la plateforme et les build-tools
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "ndk;$ANDROID_NDK_VERSION" "build-tools;$ANDROID_BUILD_TOOLS" "platforms;android-$ANDROID_PLATFORM"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Construire l'APK x86_64
        run: pwsh -NoProfile -File ./scripts/paquet-android.ps1 -Abi x86_64

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Recherche S3 (modes de GPU de l'émulateur)
        timeout-minutes: 90
        run: |
          set +e
          sdk="$ANDROID_SDK_ROOT"
          export PATH="$sdk/platform-tools:$sdk/emulator:$PATH"
          # avdmanager récent écrit sous ~/.config/.android/avd, l'émulateur lit ~/.android/avd (run 38682097874).
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$sdk/cmdline-tools/latest/bin/sdkmanager" emulator platform-tools \
            "system-images;android-$ANDROID_EMULATOR_API;google_apis;x86_64" "system-images;android-36;google_apis;x86_64" > /dev/null
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd -n a$ANDROID_EMULATOR_API -k "system-images;android-$ANDROID_EMULATOR_API;google_apis;x86_64" -d "$ANDROID_AVD_PROFILE" --force
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd -n a36 -k "system-images;android-36;google_apis;x86_64" -d "$ANDROID_AVD_PROFILE" --force
          emulator -list-avds
          sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0 xvfb mesa-utils libgl1-mesa-dri libegl1 > /dev/null
          emulator -version | head -2
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 3
          glxinfo -B | grep -E "OpenGL (renderer|version)" || true
          df -h /
          apk="build/paquet/ActCraft-$ACTCRAFT_VERSION-x86_64.apk"
          mkdir -p build/recherche
          essayer() { # $1 nom, $2 avd, $3.. options de l'émulateur
            nom=$1; avd=$2; shift 2
            echo "::group::$nom"
            emulator -avd "$avd" "$@" -noaudio -no-boot-anim -no-snapshot -wipe-data -accel on > "build/recherche/emulateur-$nom.txt" 2>&1 &
            pid=$!
            demarre=non
            for i in $(seq 100); do
              kill -0 $pid 2>/dev/null || break
              if [ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then demarre=oui; break; fi
              sleep 3
            done
            if [ $demarre = oui ]; then
              adb shell dumpsys SurfaceFlinger | grep -i "GLES" | head -2
              timeout 900 pwsh -NoProfile -File ./scripts/essai-android.ps1 -Apk "$apk" -Sortie "build/recherche/$nom" > "build/recherche/essai-$nom.txt" 2>&1
              code=$?
              cat "build/recherche/essai-$nom.txt"
              echo "RECHERCHE $nom : code $code, $(tail -1 build/recherche/essai-$nom.txt)"
              if grep -q "moitié dessiné" "build/recherche/essai-$nom.txt"; then
                timeout 600 pwsh -NoProfile -File ./scripts/essai-android.ps1 -Apk "$apk" -Sortie "build/recherche/$nom-logiciel" -RenduLogiciel > "build/recherche/essai-$nom-logiciel.txt" 2>&1
                code=$?
                cat "build/recherche/essai-$nom-logiciel.txt"
                echo "RECHERCHE $nom -RenduLogiciel : code $code, $(tail -1 build/recherche/essai-$nom-logiciel.txt)"
              fi
            else
              echo "RECHERCHE $nom : pas de démarrage"
              tail -30 "build/recherche/emulateur-$nom.txt"
            fi
            grep -iE "renderer|swiftshader|llvmpipe|lavapipe|angle|vulkan" "build/recherche/emulateur-$nom.txt" | head -8 || true
            adb emu kill > /dev/null 2>&1 || true
            for i in $(seq 30); do kill -0 $pid 2>/dev/null || break; sleep 2; done
            kill -9 $pid 2>/dev/null || true
            echo "::endgroup::"
          }
          essayer swiftshader-34 a$ANDROID_EMULATOR_API -no-window -gpu swiftshader_indirect
          essayer host-llvmpipe-34 a$ANDROID_EMULATOR_API -no-window -gpu host
          if ! grep -q "^ANDROID OK" build/recherche/essai-host-llvmpipe-34.txt 2>/dev/null; then
            essayer host-fenetre-34 a$ANDROID_EMULATOR_API -gpu host
          fi
          essayer swangle-34 a$ANDROID_EMULATOR_API -no-window -gpu swangle_indirect
          essayer lavapipe-34 a$ANDROID_EMULATOR_API -no-window -gpu lavapipe
          essayer software-34 a$ANDROID_EMULATOR_API -no-window -gpu software
          essayer swiftshader-36 a36 -no-window -gpu swiftshader_indirect
          grep -h "^RECHERCHE\|^ANDROID" build/recherche/*.txt || true

      - name: Captures de la recherche S3 (artefact court, aucun paquet)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recherche-s3
          path: |
            build/recherche/**/*.png
            build/recherche/*.txt
          retention-days: 3

      - name: Construire l'APK arm64-v8a
        if: always()
        run: pwsh -NoProfile -File ./scripts/paquet-android.ps1 -Abi arm64-v8a
