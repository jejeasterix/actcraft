name: Release

# Décision 32 du cadrage livraison-complete (docs/specs/2026-10-14-livraison-complete-cadrage.md).
# - Tag v<version> : mode « reel ». Refus si le tag ne correspond pas à la version du projet ; secrets de signature
#   obligatoires, vérifiés avant toute construction ; installateur + APK arm64-v8a signé par la clé de release
#   + image disque macOS non signée (signature ad hoc, job « macos ») ;
#   SHA256SUMS.txt ; notes tirées de CHANGELOG.md ; BROUILLON de release, jamais publié par ce workflow.
# - workflow_dispatch : « essai » ou « reel » (mêmes règles ; « reel » se lance sur le tag v<version>).
# - Push d'une branche essai-ci/release-<sujet> : « essai », pour prouver le flux sans tag (workflow_dispatch n'est
#   utilisable qu'une fois le workflow sur main). Branche essai-ci/release-mac-<sujet> : même essai sans le job
#   « windows », pour prouver les jobs du Mac quand le PC est pris.
# Exécuteurs (O98, rapport d'O86) : runner auto-hébergé du Mac mini pour tous les jobs, sauf « windows » (runner du
# PC, étapes de paquet-windows de ci.yml), et sauf « secrets » et « android » en mode réel (ubuntu-latest) : ce sont
# les deux seuls jobs qui lisent les secrets de signature, et le Mac, dont le cache d'outils et le runner sont réécrits
# par les jobs de PR, ne les reçoit jamais. Aucun repli sur macos-latest ni windows-latest.
# Qt officiel (aqtinstall), jamais celui de Homebrew : son Qt WebEngine a les codecs propriétaires (H.264), que la
# release ne redistribue pas (décision de Jérôme). Chaque job de paquet le vérifie avant de construire.
# Mode « essai » : tout est construit et essayé, l'APK est signé par une clé de débogage (non publiable) ; aucun
# secret lu, aucun artefact téléversé, aucune release. Un job y prouve que le mode réel, privé de secrets, échoue avec
# son message. Le tag, sa poussée et la publication du brouillon relèvent du go écrit de Jérôme (action finale,
# .claude/chantier.md).
# Pratiques de ci.yml (L1-T19) : actions épinglées par commit (version en commentaire), aqtinstall épinglé, délai par
# job, verdict de chaque script exigé sur sa dernière ligne en plus du code de sortie.
on:
  push:
    tags: ["v*"]
    branches: ["essai-ci/release-**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "essai (non publiable, aucune release) ou reel (secrets de signature requis, sur le tag)"
        type: choice
        options: [essai, reel]
        default: essai

# Un seul run à la fois par référence (un run en cours n'est pas annulé). Une release déjà présente pour le tag,
# brouillon compris, arrête le job « release » (RELEASE EXISTE DEJA) : jamais de second brouillon.
# Environnement GitHub « release » (tags v* seulement, secrets de signature) : référencé par « secrets » et « android »,
# en mode réel seulement ; en mode essai le nom est vide, aucun environnement n'est créé ni lu. Création au go :
# .claude/chantier.md.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Lecture seule partout ; seuls « release » (brouillon) et « nettoyer » (artefacts du run) écrivent, en mode réel.
permissions:
  contents: read

env:
  QT_VERSION: "6.12.0"

jobs:
  mode:
    runs-on: [self-hosted, macOS, ARM64, actcraft]
    # Le hook de début de job du Mac (garde-job.sh) attend une place de compilation jusqu'à 45 min, dans la durée du
    # job : délai = 45 min + durée propre du job.
    timeout-minutes: 60
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.mode.outputs.version }}
      windows: ${{ steps.mode.outputs.windows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Gardes du Mac mini (dépôt privé) sans attente de mémoire : job léger. Puis PowerShell du cache du runner.
      - uses: ./.github/actions/gardes-mac
        with:
          memoire-go: "0"

      - uses: ./.github/actions/pwsh-mac

      # Contexte passé par l'environnement, jamais interpolé dans le script (un nom de branche peut contenir « ' »).
      - id: mode
        shell: pwsh
        env:
          EVENEMENT: ${{ github.event_name }}
          TYPE_REF: ${{ github.ref_type }}
          NOM_REF: ${{ github.ref_name }}
          MODE_DEMANDE: ${{ inputs.mode }}
        run: |
          . ./scripts/version-projet.ps1
          $version = Get-ActCraftVersion
          if ($env:EVENEMENT -eq 'workflow_dispatch') { $mode = $env:MODE_DEMANDE }
          elseif ($env:TYPE_REF -eq 'tag') { $mode = 'reel' }
          else { $mode = 'essai' }
          if ($mode -cnotin 'essai', 'reel') { Write-Output "Mode inconnu « $mode » : arrêt."; exit 1 }
          if ($env:TYPE_REF -eq 'tag' -and $env:NOM_REF -cne "v$version") {
            Write-Output "Tag $env:NOM_REF différent de la version du projet (v$version) : arrêt."
            exit 1
          }
          # Job « windows » sauté seulement en essai poussé sur essai-ci/release-mac-<sujet> ; toujours joué en réel.
          $windows = if ($mode -eq 'essai' -and $env:TYPE_REF -eq 'branch' -and $env:NOM_REF -clike 'essai-ci/release-mac-*') { 'false' } else { 'true' }
          "mode=$mode" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "windows=$windows" >> $env:GITHUB_OUTPUT
          Write-Output "Mode $mode, version $version, job windows : $windows ($env:EVENEMENT, $env:TYPE_REF $env:NOM_REF)"

  # Mode réel : refus, avant toute construction, si un secret de signature manque (secret absent = variable vide).
  secrets:
    needs: mode
    if: needs.mode.outputs.mode == 'reel'
    environment: ${{ needs.mode.outputs.mode == 'reel' && 'release' || '' }}
    # ubuntu-latest, mode réel seulement (un job court par release) : il lit les secrets de signature, qui ne vont
    # jamais sur le Mac mini (cache d'outils et runner réécrits par les jobs de PR), comme le job android réel.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Secrets de signature
        shell: pwsh
        env:
          ACTCRAFT_KEYSTORE_BASE64: ${{ secrets.ACTCRAFT_KEYSTORE_BASE64 }}
          ACTCRAFT_KEYSTORE_PASSWORD: ${{ secrets.ACTCRAFT_KEYSTORE_PASSWORD }}
          ACTCRAFT_KEY_ALIAS: ${{ secrets.ACTCRAFT_KEY_ALIAS }}
          ACTCRAFT_KEY_PASSWORD: ${{ secrets.ACTCRAFT_KEY_PASSWORD }}
        run: |
          pwsh -NoProfile -File ./scripts/verifier-secrets-release.ps1 | Tee-Object -FilePath "$env:RUNNER_TEMP/secrets.txt"
          if ($LASTEXITCODE -ne 0 -or (Get-Content "$env:RUNNER_TEMP/secrets.txt" -Tail 1) -cne 'SECRETS OK') { exit 1 }

      # Les paquets du brouillon sont construits depuis le commit du tag (ref_name = v<version>, vérifié par « mode ») :
      # un workflow_dispatch « reel » lancé sur une branche est refusé, avant toute construction.
      - name: Mode réel sur le tag de la version
        shell: pwsh
        env:
          TYPE_REF: ${{ github.ref_type }}
          NOM_REF: ${{ github.ref_name }}
        run: |
          if ($env:TYPE_REF -cne 'tag') {
            Write-Output "Mode réel lancé sur $env:TYPE_REF $env:NOM_REF : à lancer sur le tag v<version>. Arrêt."
            exit 1
          }

      # Les relevés de copyright de THIRD_PARTY_NOTICES.md se font au PC : tant qu'une ligne dit « à relever », la
      # release est refusée, avant toute construction et donc avant tout brouillon. Mode réel seulement (ce job).
      - name: Notices tierces complètes
        shell: bash
        run: |
          # Lignes jointes : une mention coupée par le retour à la ligne (« à » en fin, « relever » au début de la
          # suivante) est vue aussi.
          restes=$(tr -s '[:space:]' ' ' < THIRD_PARTY_NOTICES.md | { grep -o 'à relever' || true; } | wc -l | tr -d ' ')
          if [ "$restes" != 0 ]; then
            echo "NOTICES INCOMPLETES : THIRD_PARTY_NOTICES.md contient encore $restes fois « à relever ». Release refusée."
            exit 1
          fi
          echo "NOTICES COMPLETES"

  # Mode essai : prouve que le mode réel, privé de secrets, échoue avec son message ; et que les notes existent.
  controle-mode-reel:
    needs: mode
    if: needs.mode.outputs.mode == 'essai'
    runs-on: [self-hosted, macOS, ARM64, actcraft]
    # Le hook de début de job du Mac (garde-job.sh) attend une place de compilation jusqu'à 45 min, dans la durée du
    # job : délai = 45 min + durée propre du job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/gardes-mac
        with:
          memoire-go: "0"

      - uses: ./.github/actions/pwsh-mac

      # Même script que le job « secrets », dans la forme qu'y prend un secret absent : variable définie et vide.
      # Contre-épreuve avec des valeurs factices : le contrôle laisse passer, il n'échoue donc pas toujours.
      - name: Le mode réel échoue sans secrets
        shell: pwsh
        env:
          ACTCRAFT_KEYSTORE_BASE64: ""
          ACTCRAFT_KEYSTORE_PASSWORD: ""
          ACTCRAFT_KEY_ALIAS: ""
          ACTCRAFT_KEY_PASSWORD: ""
        run: |
          $noms = 'ACTCRAFT_KEYSTORE_BASE64', 'ACTCRAFT_KEYSTORE_PASSWORD', 'ACTCRAFT_KEY_ALIAS', 'ACTCRAFT_KEY_PASSWORD'
          Write-Output "Variables définies et vides : $(@($noms | Where-Object { (Test-Path "Env:$_") -and -not [Environment]::GetEnvironmentVariable($_) }).Count) / 4"
          $sortie = @(pwsh -NoProfile -File ./scripts/verifier-secrets-release.ps1)
          $code = $LASTEXITCODE
          $sortie | Write-Output
          if ($code -ne 1 -or $sortie[-1] -notmatch '^SECRETS ABSENTS : ') {
            Write-Output 'Le mode réel aurait dû échouer sans secrets.'
            exit 1
          }
          foreach ($n in $noms) { Set-Item "Env:$n" 'factice' }
          $env:ACTCRAFT_KEYSTORE_BASE64 = 'eA=='
          $contre = @(pwsh -NoProfile -File ./scripts/verifier-secrets-release.ps1)
          $codeContre = $LASTEXITCODE
          $contre | Write-Output
          if ($codeContre -ne 0 -or $contre[-1] -cne 'SECRETS OK') {
            Write-Output 'Avec des valeurs factices, le contrôle aurait dû laisser passer.'
            exit 1
          }
          Write-Output 'CONTROLE OK : sans secrets, le mode réel échoue avant toute construction.'

      - name: Notes de la version
        shell: pwsh
        env:
          VERSION: ${{ needs.mode.outputs.version }}
        run: |
          pwsh -NoProfile -File ./scripts/notes-version.ps1 -Version $env:VERSION -Sortie notes.md | Tee-Object -FilePath "$env:RUNNER_TEMP/notes.txt"
          if ($LASTEXITCODE -ne 0 -or (Get-Content "$env:RUNNER_TEMP/notes.txt" -Tail 1) -cne 'NOTES OK : notes.md') { exit 1 }
          Get-Content notes.md

  # S1 : installateur construit et essayé sur le runner du PC, comme le job paquet-windows de ci.yml (O86) ; téléversé
  # en mode réel seulement. Aucun repli sur windows-latest. Essai S1 hors écran (aucune fenêtre sur l'écran de
  # Jérôme), refusé si ActCraft est déjà installé dans le profil (il le désinstallerait).
  windows:
    needs: [mode, secrets]
    if: ${{ !cancelled() && needs.mode.result == 'success' && needs.mode.outputs.windows == 'true' && (needs.secrets.result == 'success' || (needs.secrets.result == 'skipped' && needs.mode.outputs.mode == 'essai')) }}
    runs-on: [self-hosted, Windows, X64, actcraft]
    # Délai de paquet-windows : 260 min = 90 + 170 (garde du PC, O177 : l'attente de l'autre runner compte dans ce
    # délai, 2 h 30 au plus, plus 15 min de mémoire basse).
    timeout-minutes: 260
    steps:
      # La garde qui fait foi est C:\actions-runner-actcraft\garde-job.ps1 (ACTIONS_RUNNER_HOOK_JOB_STARTED).
      - name: Garde du runner auto-hébergé Windows (visibilité)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $visibilite = (gh api "repos/$env:GITHUB_REPOSITORY" --jq .visibility).Trim()
          if ($LASTEXITCODE -ne 0 -or $visibilite -ne 'private') {
            "::error::Dépôt '$visibilite' : runner auto-hébergé interdit. Arrêter la tâche Claude-Runner-Actcraft et désenregistrer le runner (C:\actions-runner-actcraft)."
            exit 1
          }

      # Même dossier de travail que les jobs de ci.yml : l'arbre build/ (dont build/release) reste d'un run à l'autre,
      # tout autre fichier non suivi est retiré.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          clean: false

      - name: Nettoyer la copie de travail, sauf build/
        run: git clean -ffdx -e /build/

      # Qt de C:\Qt (aqtinstall, Qt officiel), comme ci.yml, mais Qt WebEngine exigé : la release l'embarque. Son
      # Qt WebEngine doit être sans codecs propriétaires (H.264), relevé dans les fonctions activées de son module.
      - name: Qt du PC (Qt WebEngine sans H.264)
        shell: pwsh
        run: |
          $qt = "C:\Qt\$env:QT_VERSION\msvc2022_64"
          foreach ($module in 'Qt6', 'Qt6ShaderTools', 'Qt6Pdf', 'Qt6Multimedia', 'Qt6WebEngineQuick', 'Qt6WebChannel', 'Qt6Positioning') {
            if (-not (Test-Path "$qt\lib\cmake\$module")) { "::error::$module absent de $qt (aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -m qtshadertools qtimageformats qtpdf qtmultimedia qtwebview qtwebengine qtwebchannel qtpositioning)"; exit 1 }
          }
          $pri = "$qt\mkspecs\modules\qt_lib_webenginecore_private.pri"
          $actives = Select-String -LiteralPath $pri -Pattern '^QT\.webenginecore_private\.enabled_features\s*=' -ErrorAction SilentlyContinue
          if (-not $actives) { "::error::fonctions de Qt WebEngine illisibles ($pri)"; exit 1 }
          if ($actives.Line -match '(^|\s)webengine-proprietary-codecs(\s|$)') { "::error::Qt WebEngine de $qt avec codecs propriétaires (H.264) : refusé pour la release"; exit 1 }
          "Qt WebEngine sans codecs propriétaires ($pri)"
          "ACTCRAFT_QT_DIR=$qt" >> $env:GITHUB_ENV
          "$qt\bin" >> $env:GITHUB_PATH
          # 6 compilations à la fois : le PC (15 Go) porte aussi les sessions Claude pendant le build.
          "CMAKE_BUILD_PARALLEL_LEVEL=6" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Inno Setup déjà présent (candidats de paquet.ps1), sinon installé une fois dans le cache d'outils du runner
      # (RUNNER_TOOL_CACHE), par utilisateur et portable, sans droits d'administrateur. Copie de ci.yml.
      - name: Inno Setup du PC
        shell: pwsh
        run: |
          $candidats = @((Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6/ISCC.exe'), (Join-Path $HOME '.tools/InnoSetup6/ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'), (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe'))
          $iscc = $candidats | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $dossier = Join-Path $env:RUNNER_TOOL_CACHE 'innosetup/6.7.3'
            $iscc = Join-Path $dossier 'ISCC.exe'
            if (-not (Test-Path $iscc)) {
              $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
              Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
              $somme = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
              if ($somme -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw "innosetup-6.7.3.exe : somme inattendue $somme" }
              $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
                '/CURRENTUSER', '/PORTABLE=1', '/NOICONS', "/DIR=`"$dossier`"")
              Remove-Item -Force $setup
              if ($p.ExitCode -ne 0 -or -not (Test-Path $iscc)) { throw "installation d'Inno Setup en échec (code $($p.ExitCode))" }
            }
          }
          "Inno Setup : $iscc"
          "ACTCRAFT_ISCC=$iscc" >> $env:GITHUB_ENV

      # build/release est partagé avec les runs d'autres branches (ci.yml, preuves-windows.yml) : le cache CMake est
      # retiré pour que les options de ce commit s'appliquent ; Ninja garde les objets compilés.
      - name: Cache CMake de build/release retiré
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build/release/CMakeCache.txt, build/release/CMakeFiles

      # L'installateur ne livre que actcraft.exe : seule cette cible est compilée, et les binaires de test d'un run
      # précédent sont retirés de build/release (disque plein du PC, run 42459120044).
      - name: Compiler actcraft seul en release
        timeout-minutes: 90
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build/release/tests
          Get-ChildItem -ErrorAction SilentlyContinue build/release -File -Filter 'tst_*' | Remove-Item -Force
          $libre = (Get-PSDrive (Get-Location).Drive.Name).Free / 1GB
          "Espace libre : {0:N1} Go" -f $libre
          cmake --preset release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset release --target actcraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # actcraft.exe vient de l'étape précédente (-SansConstruire). Verdict exigé sur la dernière ligne (contrôle des
      # licences compris : paquet.ps1 appelle verifier-licences.ps1).
      - name: Construire l'installateur
        timeout-minutes: 90
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/paquet.ps1 -SansConstruire | Tee-Object -FilePath "$env:RUNNER_TEMP/paquet.txt"
          if ($LASTEXITCODE -ne 0 -or (Get-Content "$env:RUNNER_TEMP/paquet.txt" -Tail 1) -notmatch '^PAQUET OK : ') { exit 1 }

      - name: Essai de l'installateur (S1, hors écran)
        shell: pwsh
        run: |
          $traces = @((Join-Path ([Environment]::GetFolderPath('Programs')) 'ActCraft.lnk'),
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{5F0C2E7A-3B4D-4C8E-9A61-ACC0C4AF7A10}_is1',
            'HKCU:\Software\Classes\ActCraft.Document', 'HKCU:\Software\Classes\.actcraft')
          $presentes = @($traces | Where-Object { Test-Path -LiteralPath $_ })
          if ($presentes) { "::error::ActCraft déjà installé dans le profil du runner ($($presentes -join ', ')) : essai S1 refusé, il le désinstallerait."; exit 1 }
          pwsh -NoProfile -File ./scripts/essai-installateur.ps1 -HorsEcran | Tee-Object -FilePath "$env:RUNNER_TEMP/s1.txt"
          if ($LASTEXITCODE -ne 0 -or (Get-Content "$env:RUNNER_TEMP/s1.txt" -Tail 1) -cne 'INSTALLATEUR OK') { exit 1 }

      - name: Somme SHA-256
        shell: pwsh
        env:
          VERSION: ${{ needs.mode.outputs.version }}
        run: |
          Get-FileHash "build/paquet/ActCraft-$env:VERSION-setup.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }

      - name: Conserver l'installateur pour le brouillon (mode réel seulement)
        if: needs.mode.outputs.mode == 'reel'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paquet-windows
          path: build/paquet/ActCraft-${{ needs.mode.outputs.version }}-setup.exe
          if-no-files-found: error
          retention-days: 1

  # Paquet macOS non signé (amendement 3 du plan du lot 11), aucun secret, sur le runner du Mac mini (aucun repli sur
  # macos-latest). Image téléversée en mode réel seulement.
  macos:
    needs: [mode, secrets]
    if: ${{ !cancelled() && needs.mode.result == 'success' && (needs.secrets.result == 'success' || (needs.secrets.result == 'skipped' && needs.mode.outputs.mode == 'essai')) }}
    runs-on: [self-hosted, macOS, ARM64, actcraft]
    # 45 min d'attente possible au hook de début de job (place de compilation), puis premier run : Qt officiel
    # téléchargé dans le cache du runner (Qt WebEngine compris), compilation Release, image disque.
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Dépôt privé, et 3 Go de mémoire disponible avant de compiler (le Mac porte aussi les sessions Claude).
      - uses: ./.github/actions/gardes-mac

      # Qt officiel installé une fois dans le cache du runner (hors des worktrees des sessions), jamais celui de
      # Homebrew (codecs propriétaires). Dossier propre à ce job et nommé par la liste des modules : un cache trouvé
      # n'est jamais réinstallé, et le cache Qt/ de ci.yml (autres modules, autre témoin) ne l'efface pas. Une autre
      # liste de modules prend un autre dossier ; les anciens dossiers sont retirés à l'installation. Témoin écrit en
      # dernier : une installation interrompue est refaite au run suivant. ccache garde la compilation chaude.
      - name: Qt officiel, Ninja et ccache du Mac
        shell: bash
        run: |
          cache="$HOME/actions-runner-actcraft/_cache"
          modules="qtshadertools qtimageformats qtpdf qtmultimedia qtwebview qtwebengine qtwebchannel qtpositioning"
          base="$cache/Qt-officiel"
          racine="$base/$QT_VERSION-$(echo "$modules" | tr ' ' '-')"
          if [ -f "$racine/.complet" ]; then
            echo "Qt $QT_VERSION officiel trouvé dans le cache : $racine"
          else
            rm -rf "$base"
            mkdir -p "$racine"
            python3 -m venv "$cache/venv-aqt"
            "$cache/venv-aqt/bin/pip" install -q "git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
            # shellcheck disable=SC2086 # $modules : un mot par module
            "$cache/venv-aqt/bin/python" -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -m $modules --outputdir "$racine"
            touch "$racine/.complet"
          fi
          qt_dir="$racine/$QT_VERSION/macos"
          [ -x "$qt_dir/bin/macdeployqt" ] || { echo "::error::macdeployqt absent de $qt_dir"; exit 1; }
          command -v ninja >/dev/null || { echo "::error::ninja absent du Mac (brew install ninja)"; exit 1; }
          echo "Qt : $qt_dir"
          echo "ACTCRAFT_QT_DIR=$qt_dir" >> "$GITHUB_ENV"
          echo "$qt_dir/bin" >> "$GITHUB_PATH"
          # 4 compilations à la fois : le Mac (8 Go) garde de la mémoire pour les sessions pendant le build.
          echo "CMAKE_BUILD_PARALLEL_LEVEL=4" >> "$GITHUB_ENV"
          if command -v ccache >/dev/null; then
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CCACHE_DIR=$cache/ccache" >> "$GITHUB_ENV"
          fi

      # Qt WebEngine sans codecs propriétaires (H.264) : relevé dans les fonctions activées de son module.
      - name: Qt WebEngine sans H.264
        shell: bash
        run: |
          pri="$ACTCRAFT_QT_DIR/mkspecs/modules/qt_lib_webenginecore_private.pri"
          actives=$(grep -E '^QT\.webenginecore_private\.enabled_features[[:space:]]*=' "$pri") ||
            { echo "::error::fonctions de Qt WebEngine illisibles ($pri)"; exit 1; }
          if grep -qE '(^|[[:space:]])webengine-proprietary-codecs([[:space:]]|$)' <<<"$actives"; then
            echo "::error::Qt WebEngine de $ACTCRAFT_QT_DIR avec codecs propriétaires (H.264) : refusé pour la release"
            exit 1
          fi
          echo "Qt WebEngine sans codecs propriétaires ($pri)"

      # paquet-mac.sh refuse une construction où ACTCRAFT_MEDIA ou ACTCRAFT_WEBFRAME vaut OFF (module Qt manquant), et
      # appelle verifier-licences-mac.sh (LICENCES OK exigé).
      - name: Construire l'image disque
        shell: bash
        run: |
          if ./scripts/paquet-mac.sh > "$RUNNER_TEMP/paquet-mac.txt" 2>&1; then code=0; else code=$?; fi
          cat "$RUNNER_TEMP/paquet-mac.txt"
          if [ "$code" != 0 ] || ! tail -1 "$RUNNER_TEMP/paquet-mac.txt" | grep -q '^DMG OK : '; then exit 1; fi
          grep -qx 'LICENCES OK' "$RUNNER_TEMP/paquet-mac.txt" || { echo "::error::LICENCES OK absent du journal de paquet-mac.sh"; exit 1; }

      # Bloquant : bundle, signature, qt.conf, otool, bibliothèques chargées à --version.
      - name: Essai de l'image disque
        shell: bash
        run: |
          if ./scripts/essai-dmg.sh > "$RUNNER_TEMP/essai-dmg.txt" 2>&1; then code=0; else code=$?; fi
          cat "$RUNNER_TEMP/essai-dmg.txt"
          if [ "$code" != 0 ] || [ "$(tail -1 "$RUNNER_TEMP/essai-dmg.txt")" != "ESSAI DMG OK" ]; then exit 1; fi

      # Informatif : une fenêtre ne s'ouvre pas sûrement sur l'exécuteur ; le lancement est prouvé par L11-T29m sur le Mac.
      - name: Lancement de 3 s (informatif)
        continue-on-error: true
        shell: bash
        run: |
          # bash -eo pipefail : un lancement en échec fait déjà échouer le pipeline (donc l'étape).
          ./scripts/essai-dmg.sh --lancer 2>&1 | tail -4

      - name: Somme SHA-256
        shell: bash
        env:
          VERSION: ${{ needs.mode.outputs.version }}
        run: |
          cd build/paquet
          shasum -a 256 "ActCraft-$VERSION-macos-arm64.dmg"

      - name: Conserver l'image disque pour le brouillon (mode réel seulement)
        if: needs.mode.outputs.mode == 'reel'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paquet-macos
          path: build/paquet/ActCraft-${{ needs.mode.outputs.version }}-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 1

  # S3 : APK arm64-v8a seul (la release ne livre que cette ABI, décision 28). Clé de release en mode réel ; clé de
  # débogage en mode essai (APK annoncé non publiable). Téléversé en mode réel seulement.
  android:
    needs: [mode, secrets]
    if: ${{ !cancelled() && needs.mode.result == 'success' && (needs.secrets.result == 'success' || (needs.secrets.result == 'skipped' && needs.mode.outputs.mode == 'essai')) }}
    # Mode réel seulement (secrets de signature) ; vide en mode essai : aucun environnement.
    environment: ${{ needs.mode.outputs.mode == 'reel' && 'release' || '' }}
    # Mode réel : ubuntu-latest (réserve de relecture d'O86 : le cache d'outils du Mac, réécrit par les jobs de PR, ne
    # reçoit pas la clé de signature). Mode essai : Mac mini, chaîne Android du cache du runner, comme ci.yml.
    runs-on: ${{ needs.mode.outputs.mode == 'reel' && 'ubuntu-latest' || fromJSON('["self-hosted", "macOS", "ARM64", "actcraft"]') }}
    # Mac mini : hook de début de job (45 min au plus), attente de mémoire (15 min au plus), premier run plus long (Qt
    # pour Android dans le cache).
    timeout-minutes: ${{ needs.mode.outputs.mode == 'reel' && 25 || 105 }}
    env:
      # Un démon Gradle resté vivant verrouille le dossier de construction (piège L1-T17).
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/gardes-mac
        if: runner.environment != 'github-hosted'

      - uses: ./.github/actions/pwsh-mac
        if: runner.environment != 'github-hosted'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      # Qt 6.12 pour Android exige JDK 21 (VERIF jdk17, docs/verifications/2026-10-14-outillage-paquets.md). Sur le
      # Mac, le JDK va dans le cache d'outils du runner.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Versions de la chaîne Android
        run: cat packaging/android/versions.env >> "$GITHUB_ENV"

      - name: Installer Ninja et aqtinstall
        if: runner.environment == 'github-hosted'
        run: python -m pip install ninja "git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      # Qt Android arm64-v8a seul, mêmes modules que le job android de ci.yml ; ACTCRAFT_QT_ANDROID_X86_64_DIR désigne
      # le même dossier pour que dev-env-android.ps1 ne s'arrête pas (le preset android-x86_64 n'est pas construit ici).
      - name: Installer Qt (hôte et Android arm64-v8a)
        if: runner.environment == 'github-hosted'
        run: |
          python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -m qtshadertools qtimageformats qtpdf qtmultimedia qtwebview --outputdir "$RUNNER_TEMP/Qt"
          python -m aqt install-qt all_os android "$QT_VERSION" android_arm64_v8a -m qtshadertools qtimageformats qtpdf qtmultimedia qtwebview --outputdir "$RUNNER_TEMP/Qt"
          echo "ACTCRAFT_QT_HOST_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
          echo "ACTCRAFT_QT_ANDROID_ARM64_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/android_arm64_v8a" >> "$GITHUB_ENV"
          echo "ACTCRAFT_QT_ANDROID_X86_64_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/android_arm64_v8a" >> "$GITHUB_ENV"

      - name: Installer le NDK, la plateforme et les build-tools
        if: runner.environment == 'github-hosted'
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "ndk;$ANDROID_NDK_VERSION" "build-tools;$ANDROID_BUILD_TOOLS" "platforms;android-$ANDROID_PLATFORM"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      # Mac mini, mode essai seulement : sans émulateur (la release n'essaie pas l'APK), ABI arm64-v8a seule.
      - name: Chaîne Android du Mac (cache du runner)
        if: runner.environment != 'github-hosted'
        run: ./scripts/ci/outils-android-mac.sh arm64_v8a

      # Secrets lus en mode réel seulement (vides en mode essai). Clé et alias lus puis retirés de l'environnement de
      # l'étape avant tout lancement ; mots de passe transmis à paquet-android.ps1 par ses variables
      # (ACTCRAFT_KEYSTORE_PASS, ACTCRAFT_KEY_PASS), jamais sur une ligne de commande : le script les retire de son
      # environnement avant la construction (ni CMake ni Gradle ne les héritent) et ne les passe qu'à apksigner. Le
      # signataire écrit par paquet-android.ps1 est contrôlé : clé de débogage refusée en mode réel, exigée (et
      # annoncée) en essai.
      - name: Construire l'APK arm64-v8a
        shell: pwsh
        env:
          MODE: ${{ needs.mode.outputs.mode }}
          VERSION: ${{ needs.mode.outputs.version }}
          ACTCRAFT_KEYSTORE_BASE64: ${{ needs.mode.outputs.mode == 'reel' && secrets.ACTCRAFT_KEYSTORE_BASE64 || '' }}
          ACTCRAFT_KEY_ALIAS: ${{ needs.mode.outputs.mode == 'reel' && secrets.ACTCRAFT_KEY_ALIAS || '' }}
          ACTCRAFT_KEYSTORE_PASS: ${{ needs.mode.outputs.mode == 'reel' && secrets.ACTCRAFT_KEYSTORE_PASSWORD || '' }}
          ACTCRAFT_KEY_PASS: ${{ needs.mode.outputs.mode == 'reel' && secrets.ACTCRAFT_KEY_PASSWORD || '' }}
        run: |
          $journal = Join-Path $env:RUNNER_TEMP 'apk.txt'
          $base64 = $env:ACTCRAFT_KEYSTORE_BASE64
          $alias = $env:ACTCRAFT_KEY_ALIAS
          Remove-Item -ErrorAction SilentlyContinue Env:ACTCRAFT_KEYSTORE_BASE64, Env:ACTCRAFT_KEY_ALIAS
          if ($env:MODE -eq 'reel') {
            $ks = Join-Path $env:RUNNER_TEMP 'release.keystore'
            try {
              [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($base64))
              $base64 = $null
              pwsh -NoProfile -File ./scripts/paquet-android.ps1 -Abi arm64-v8a -Keystore $ks -KeyAlias $alias |
                Tee-Object -FilePath $journal
              $code = $LASTEXITCODE
            } finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $ks
            }
          } else {
            Remove-Item -ErrorAction SilentlyContinue Env:ACTCRAFT_KEYSTORE_PASS, Env:ACTCRAFT_KEY_PASS
            pwsh -NoProfile -File ./scripts/paquet-android.ps1 -Abi arm64-v8a | Tee-Object -FilePath $journal
            $code = $LASTEXITCODE
          }
          if ($code -ne 0 -or (Get-Content $journal -Tail 1) -cne 'APK OK') { exit 1 }
          $lu = Select-String -Path $journal -Pattern '^arm64-v8a : signature = (.+)$' | Select-Object -Last 1
          $signataire = if ($lu) { $lu.Matches[0].Groups[1].Value } else { '' }
          $debogage = $signataire -match '^CN=Android Debug(,|$)'
          if ($env:MODE -eq 'reel') {
            if (-not $signataire -or $debogage) { Write-Output "APK signé par « $signataire » : refusé en mode réel."; exit 1 }
          } else {
            if (-not $debogage) { Write-Output "Mode essai : signataire inattendu « $signataire »."; exit 1 }
            Write-Output "APK NON PUBLIABLE : signé par la clé de débogage ($signataire), mode essai."
          }
          Get-FileHash "build/paquet/ActCraft-$env:VERSION-arm64-v8a.apk" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }

      - name: Conserver l'APK pour le brouillon (mode réel seulement)
        if: needs.mode.outputs.mode == 'reel'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paquet-android
          path: build/paquet/ActCraft-${{ needs.mode.outputs.version }}-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 1

  # Mode réel seulement : brouillon de release, jamais publié ici (publication = go écrit, action finale).
  release:
    needs: [mode, secrets, windows, android, macos]
    if: needs.mode.outputs.mode == 'reel'
    # Sans environnement : ce job ne lit aucun secret de signature, et aucun ne doit atteindre le Mac mini. La règle de
    # l'environnement « release » (tags v* seulement) est déjà tenue par le job « secrets », dont il dépend.
    runs-on: [self-hosted, macOS, ARM64, actcraft]
    # Le hook de début de job du Mac (garde-job.sh) attend une place de compilation jusqu'à 45 min, dans la durée du
    # job : délai = 45 min + durée propre du job.
    timeout-minutes: 65
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/gardes-mac
        with:
          memoire-go: "0"

      - uses: ./.github/actions/pwsh-mac

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: paquets
          merge-multiple: true

      - name: Sommes SHA-256 et notes
        shell: pwsh
        env:
          VERSION: ${{ needs.mode.outputs.version }}
        run: |
          $attendus = @("ActCraft-$env:VERSION-arm64-v8a.apk", "ActCraft-$env:VERSION-macos-arm64.dmg", "ActCraft-$env:VERSION-setup.exe")
          $lus = @(Get-ChildItem paquets -File | ForEach-Object Name | Sort-Object)
          if (($lus -join ', ') -cne ($attendus -join ', ')) { Write-Output "Paquets inattendus : $($lus -join ', ')"; exit 1 }
          Get-ChildItem paquets -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding utf8NoBOM paquets/SHA256SUMS.txt
          Get-Content paquets/SHA256SUMS.txt
          pwsh -NoProfile -File ./scripts/notes-version.ps1 -Version $env:VERSION -Sortie notes.md | Tee-Object -FilePath "$env:RUNNER_TEMP/notes.txt"
          if ($LASTEXITCODE -ne 0 -or (Get-Content "$env:RUNNER_TEMP/notes.txt" -Tail 1) -cne 'NOTES OK : notes.md') { exit 1 }

      # Lecture seule : toutes les releases du dépôt, brouillons compris (le jeton du job les voit). Un échec de la
      # lecture arrête le job (bash -eo pipefail), il ne vaut jamais « absente ».
      - name: Aucune release pour ce tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.mode.outputs.version }}
        run: |
          tags=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name')
          if grep -qxF "v$VERSION" <<<"$tags"; then
            echo "RELEASE EXISTE DEJA : v$VERSION (brouillon ou publiée) ; aucun second brouillon créé."
            exit 1
          fi
          echo "Aucune release pour v$VERSION."

      - name: Brouillon de release (jamais publié ici)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.mode.outputs.version }}
        run: |
          gh release create "v$VERSION" --draft --verify-tag \
            --title "ActCraft $VERSION" --notes-file notes.md paquets/*

  # Mode réel : les artefacts du run (installateur, APK signé, image disque .dmg) ne servent qu'à assembler le brouillon. Supprimés à
  # la fin quoi qu'il arrive (échec de « windows », d'« android » ou de « release » compris), pour qu'ils ne restent
  # pas téléchargeables avant la publication (go écrit).
  nettoyer:
    needs: [mode, windows, android, macos, release]
    if: always() && needs.mode.outputs.mode == 'reel'
    runs-on: [self-hosted, macOS, ARM64, actcraft]
    # Le hook de début de job du Mac (garde-job.sh) attend une place de compilation jusqu'à 45 min, dans la durée du
    # job : délai = 45 min + durée propre du job.
    timeout-minutes: 60
    # contents: read pour le checkout de l'action locale des gardes (dépôt privé).
    permissions:
      actions: write
      contents: read
    steps:
      # Copie du dépôt pour l'action locale des gardes (dépôt privé) ; rien d'autre n'en est lu.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/gardes-mac
        with:
          memoire-go: "0"

      # bash explicite = « bash -eo pipefail » : un échec de la liste ou d'une suppression fait échouer l'étape. Fin
      # vérifiée : la liste relue doit être vide.
      - name: Supprimer les artefacts du run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LISTE: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100
        run: |
          ids=$(gh api --paginate "$LISTE" --jq '.artifacts[].id')
          for artefact in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artefact"
          done
          restants=$(gh api --paginate "$LISTE" --jq '.artifacts[].id')
          if [ -n "$restants" ]; then
            echo "ARTEFACTS RESTANTS : $restants"
            exit 1
          fi
          echo "Artefacts du run supprimés ($(wc -w <<<"$ids") supprimé(s), 0 restant)."
